name: checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # Test-only login; the real credentials live in Streamlit secrets.
      APP_USERNAME: ci-user
      APP_PASSWORD: ci-pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Data, tools, login, usage and app start
        run: pytest -m "not ui" -q
      - name: Install a browser
        run: python -m playwright install --with-deps chromium
      - name: One-screen layout at four window sizes
        run: pytest -m ui -q
