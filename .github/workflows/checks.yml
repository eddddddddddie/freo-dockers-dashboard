name: checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the usage log tests (the Supabase path).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Test-only login; the real credentials live in Streamlit secrets.
      APP_USERNAME: ci-user
      APP_PASSWORD: ci-pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Data, tools, login, usage and app start
        run: pytest -m "not ui" -q
        env:
          USAGE_TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
      - name: Install a browser
        run: python -m playwright install --with-deps chromium
      - name: One-screen layout at four window sizes
        run: pytest -m ui -q
