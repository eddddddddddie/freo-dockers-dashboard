<!doctype html>
<html>
<head><meta charset="utf-8"><title>tour</title></head>
<body style="margin:0">
<script>
// First-visit guided tour of the Coach View (driver.js, loaded into the app page).
// Runs once per browser (remembered in localStorage) and again whenever Python
// passes a new `force` value (Deep dives -> App tour). Sends nothing back, so it
// never reruns the app.
(function () {
  var DONE_KEY = "freoCoachTourDone_v1";
  var LIB = "https://cdn.jsdelivr.net/npm/driver.js@1.8.0/dist/";
  var P = window.parent, doc = P.document;

  function send(type, extra) {
    P.postMessage(Object.assign({isStreamlitMessage: true, type: type}, extra), "*");
  }

  var STEPS = [
    {title: "Welcome to the Coach View",
     text: "The whole season on one screen, plus Wharf-ai, an analyst you can question. This quick tour shows where everything is. Use the arrow keys or the buttons; Esc skips it."},
    {el: ".cv-band", title: "Season at a glance",
     text: "Record, win rate, average margin and the last five results. Hover a result for the score."},
    {el: ".st-key-season", title: "Pick a season",
     text: "Switch between 2025 and 2026. Every number on the page follows."},
    {el: ".st-key-view", title: "Four views",
     text: "Season, Match (one game against the season average), Player (one player's season) and Scout (any club against the league). The web address keeps your place, so you can bookmark or send a view."},
    {el: ".st-key-deep_dive", title: "Deep dives",
     text: "Bigger views: player map, year on year, opponents, the opponent scout report, a quarter-time check and Wharf-ai usage. This tour is here too."},
    {el: ".cv-tiles", title: "Key numbers",
     text: "Season value, change on last season (green is good, red is not, grey has no good or bad) and a trend line with a point per game. Hover the line for each game."},
    {el: ".st-key-card_strip", title: "Game strip",
     text: "One column per game. Purple means Freo won that count, cyan means the opposition did. Click any game to open it in Match view."},
    {el: ".st-key-card_wherewin", title: "Where we win",
     text: "Win rate when Freo win the count on each stat, against when the opposition does."},
    {el: ".st-key-card_quarters", title: "Quarters",
     text: "Points per quarter, or switch to W v L for the average margin at each break in wins and losses."},
    {el: ".st-key-card_form", title: "Player form",
     text: "The last six games for the top players, shaded against each player's own season average. Pick the stat at the top right, and click a player for their profile."},
    {el: ".st-key-card_drivers", title: "What drives our margin",
     text: "How closely each differential moves with the final margin. It shows association, not cause."},
    {el: ".st-key-card_wharfai", title: "Ask Wharf-ai",
     text: "Ask anything about the data, or tap a suggestion. Every number it gives is calculated from the data, it draws charts when they help, and it suggests follow-up questions."},
    {title: "That's it",
     text: "Replay this tour any time from Deep dives, then App tour."}
  ];

  function load(cb) {
    if (P.driver && P.driver.js) return cb();
    if (!doc.getElementById("freo-driver-css")) {
      var l = doc.createElement("link");
      l.id = "freo-driver-css"; l.rel = "stylesheet"; l.href = LIB + "driver.css";
      doc.head.appendChild(l);
      var st = doc.createElement("style");
      st.textContent =
        ".driver-popover{font-family:Inter,system-ui,sans-serif;border-radius:10px;max-width:320px;" +
        "box-shadow:0 8px 30px rgba(0,0,0,.18)}" +
        ".driver-popover-title{font-weight:800;font-size:15px;letter-spacing:-.2px;color:#1A1A1A}" +
        ".driver-popover-description{font-size:13px;line-height:1.45;color:#525252}" +
        ".driver-popover-progress-text{color:#525252;font-size:12px}" +
        ".driver-popover-footer button{font-family:Inter,system-ui,sans-serif;border-radius:6px;" +
        "font-size:12px;text-shadow:none;padding:5px 10px}" +
        ".driver-popover-next-btn{background:#331C54!important;color:#fff!important;border-color:#331C54!important}";
      doc.head.appendChild(st);
    }
    var s = doc.createElement("script");
    s.src = LIB + "driver.js.iife.js";
    s.onload = cb;
    doc.head.appendChild(s);
  }

  function start() {
    var steps = STEPS.filter(function (s) { return !s.el || doc.querySelector(s.el); })
      .map(function (s) {
        var step = {popover: {title: s.title, description: s.text}};
        if (s.el) step.element = s.el;
        return step;
      });
    var d = P.driver.js.driver({
      showProgress: true, allowClose: true, overlayOpacity: 0.55, stagePadding: 6,
      stageRadius: 10, nextBtnText: "Next", prevBtnText: "Back", doneBtnText: "Done",
      steps: steps,
      onDestroyed: function () {
        P.__freoTourActive = false;
        try { P.localStorage.setItem(DONE_KEY, "1"); } catch (e) {}
      }
    });
    P.__freoTourActive = true;
    d.drive();
  }

  function maybeStart(force) {
    var seen = false;
    try { seen = P.localStorage.getItem(DONE_KEY) === "1"; } catch (e) {}
    var forced = force && force !== P.__freoTourForce;
    if (forced) P.__freoTourForce = force;
    // Reruns re-render this frame; never start a second tour over a running one.
    if ((seen && !forced) || P.__freoTourRunning || P.__freoTourActive) return;
    P.__freoTourRunning = true;
    // Wait until every card the tour highlights has rendered (or 10 s), so no
    // step is dropped for an element that simply hasn't drawn yet.
    var targets = STEPS.filter(function (s) { return s.el; }).map(function (s) { return s.el; });
    var tries = 0, timer = setInterval(function () {
      var ready = targets.every(function (sel) { return doc.querySelector(sel); });
      if ((ready && doc.querySelector(".js-plotly-plot")) || ++tries > 40) {
        clearInterval(timer);
        load(function () { P.__freoTourRunning = false; start(); });
      }
    }, 250);
  }

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "streamlit:render") {
      send("streamlit:setFrameHeight", {height: 0});
      maybeStart((e.data.args || {}).force);
    }
  });
  send("streamlit:componentReady", {apiVersion: 1});
})();
</script>
</body>
</html>
