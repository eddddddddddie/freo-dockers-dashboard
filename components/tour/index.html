<!doctype html>
<html>
<head><meta charset="utf-8"><title>tour</title></head>
<body style="margin:0">
<script>
// Guided tour of the Coach View (driver.js, loaded into the app page).
// First visit in a browser: a small prompt points at the ? button ("New here?")
// and the button pulses; "Take the tour" starts it, closing the prompt dismisses
// it. Either way it is remembered (localStorage) and not shown again. The full
// tour runs whenever Python passes a new `force` value (the ? button). Sends
// nothing back, so it never reruns the app.
(function () {
  var DONE_KEY = "freoCoachTourDone_v2";   // v2's tour: everyone is offered it once
  var LIB = "https://cdn.jsdelivr.net/npm/driver.js@1.8.0/dist/";
  var P = window.parent, doc = P.document;

  function send(type, extra) {
    P.postMessage(Object.assign({isStreamlitMessage: true, type: type}, extra), "*");
  }

  var STEPS = [
    {title: "Welcome to the Coach View",
     text: "Five places around a coach's week, with Wharf-ai, an analyst you can question, always beside the page. This quick tour shows the page you are on. Use the arrow keys or the buttons; Esc skips it."},
    {el: ".st-key-v2_place", title: "Five places",
     text: "Last game (the review), Next opponent (the briefing and a simulated match), Our season (the trends), Players (squad, profiles and comparisons) and Game day (the quarter-time check). The web address keeps your place, so you can bookmark or send any page."},
    {el: ".st-key-season", title: "Pick a season",
     text: "Every number on every page follows the season, compared with the one before."},
    {el: ".cv-band", title: "The band",
     text: "The page's headline: the score, the record, the ladder spot or the player, with the last five results where they help."},
    {el: ".cv-tiles", title: "Key numbers",
     text: "Each value with its comparison: green is good, red is not, grey has no good or bad. Hover a trend line for each game."},
    {el: ".st-key-card_v2_momentum", title: "Momentum",
     text: "The margin after every score, and under it who had been scoring lately (each score fades by half every 4 minutes). The game's biggest run is shaded."},
    {el: ".st-key-card_v2_sim", title: "Simulate the match",
     text: "Freo against this club, played 10,000 times by a model of both clubs' recent form: win chance by venue, likely margins and one example game. It is a forecast, labelled so, with how well it tested."},
    {el: ".st-key-card_v2_last5", title: "Their last five games",
     text: "Each of the club's recent games from their side: the margin after every score and who was on top when. Fast starts and strong finishes show at a glance."},
    {el: ".st-key-card_v2_strip", title: "Every game at once",
     text: "Every game's margin on one clock, wins purple and losses grey, the averages in bold, and the season's average momentum underneath. Click a game to open it; switch to Counts for the game strip."},
    {el: ".st-key-card_gmatch, .st-key-card_v2_opp_ground, .st-key-card_v2_season_ground, .st-key-card_gplayer", title: "On the ground (simulated)",
     text: "Heat maps, where goals, marks and possessions happened, and GPS running. The counts are real; the places and running are simulated, a demo of what tracking data would show, and tagged SIMULATED."},
    {el: "[class*=st-key-ask_v2_]", title: "Ask about any card",
     text: "Each card's Ask button sends its question to Wharf-ai."},
    {el: ".st-key-card_players", title: "One click rule",
     text: "Any game opens it in Last game; any player opens their profile in Players. Click a row here to try it."},
    {el: ".st-key-card_wharfai, .st-key-wa_dock", title: "Wharf-ai",
     text: "Ask anything about the data, or tap a suggestion. Every number it gives is calculated from the data, it draws charts when they help, and it suggests what to ask next."},
    {el: ".st-key-tour_btn", title: "That's it",
     text: "Replay this tour on any page with this ? button."}
  ];

  // Phones: one scrolling column, Wharf-ai docked at the bottom.
  var PHONE_STEPS = [
    {title: "Welcome to the Coach View",
     text: "Five places around a coach's week, with Wharf-ai, an analyst you can question, docked at the bottom. This quick tour shows the page you are on."},
    {el: ".st-key-v2_place", title: "Five places",
     text: "Last game, Next opponent, Our season, Players and Game day. Pick one here."},
    {el: ".st-key-season", title: "Pick a season", text: "Switch seasons; every number follows."},
    {el: ".cv-band", title: "At a glance", text: "The page's headline numbers."},
    {el: ".cv-tiles", title: "Key numbers",
     text: "Each value with its comparison: green is good, red is not."},
    {el: ".st-key-wa_dock", title: "Wharf-ai",
     text: "Tap to ask about the page you are on. Every number it gives is calculated from the data."},
    {el: ".st-key-tour_btn", title: "That's it", text: "Replay this tour any time with this ? button."}
  ];

  function load(cb) {
    if (P.driver && P.driver.js) return cb();
    if (!doc.getElementById("freo-driver-css")) {
      var l = doc.createElement("link");
      l.id = "freo-driver-css"; l.rel = "stylesheet"; l.href = LIB + "driver.css";
      doc.head.appendChild(l);
      var st = doc.createElement("style");
      st.textContent =
        ".driver-popover{font-family:Inter,system-ui,sans-serif;border-radius:10px;max-width:320px;" +
        "box-shadow:0 8px 30px rgba(0,0,0,.18)}" +
        ".driver-popover-title{font-weight:800;font-size:15px;letter-spacing:-.2px;color:#1A1A1A}" +
        ".driver-popover-description{font-size:13px;line-height:1.45;color:#525252}" +
        ".driver-popover-progress-text{color:#525252;font-size:12px}" +
        ".driver-popover-footer button{font-family:Inter,system-ui,sans-serif;border-radius:6px;" +
        "font-size:12px;text-shadow:none;padding:5px 10px}" +
        ".driver-popover-next-btn{background:#331C54!important;color:#fff!important;border-color:#331C54!important}" +
        "@keyframes freo-pulse{0%{box-shadow:0 0 0 0 rgba(51,28,84,.55)}70%{box-shadow:0 0 0 10px rgba(51,28,84,0)}" +
        "100%{box-shadow:0 0 0 0 rgba(51,28,84,0)}}" +
        ".freo-pulse{animation:freo-pulse 1.6s ease-out infinite}";
      doc.head.appendChild(st);
    }
    var s = doc.getElementById("freo-driver-js");
    if (!s) {
      s = doc.createElement("script");
      s.id = "freo-driver-js"; s.src = LIB + "driver.js.iife.js";
      doc.head.appendChild(s);
    }
    s.addEventListener("load", function () { cb(); });
  }

  function start() {
    var steps = (P.__freoTourPhone ? PHONE_STEPS : STEPS).filter(function (s) { return !s.el || doc.querySelector(s.el); })
      .map(function (s) {
        var step = {popover: {title: s.title, description: s.text}};
        if (s.el) step.element = doc.querySelector(s.el);   // the first match on this page
        return step;
      });
    var d = P.driver.js.driver({
      showProgress: true, allowClose: true, overlayOpacity: 0.55, stagePadding: 6,
      stageRadius: 10, nextBtnText: "Next", prevBtnText: "Back", doneBtnText: "Done",
      steps: steps,
      onDestroyed: function () {
        P.__freoTourActive = false;
        markSeen();
      }
    });
    P.__freoTourActive = true;
    d.drive();
  }

  function markSeen() {
    try { P.localStorage.setItem(DONE_KEY, "1"); } catch (e) {}
    var b = doc.querySelector(".st-key-tour_btn button");
    if (b) b.classList.remove("freo-pulse");
  }

  // First visit: a one-step prompt anchored on the ? button instead of the tour.
  function prompt() {
    var btn = doc.querySelector(".st-key-tour_btn button");
    if (btn) btn.classList.add("freo-pulse");
    var take = false;
    var d = P.driver.js.driver({
      allowClose: true, overlayOpacity: 0.35, stagePadding: 6, stageRadius: 20,
      showButtons: ["next", "close"], doneBtnText: "Take the tour",
      steps: [{element: ".st-key-tour_btn", popover: {
        title: "New here?",
        description: "Take a one-minute tour of the Coach View. You can start it any time with this ? button.",
        side: P.__freoTourPhone ? "bottom" : "left", align: P.__freoTourPhone ? "end" : "start"}}],
      onNextClick: function () { take = true; d.destroy(); },
      onDestroyed: function () {
        P.__freoTourActive = false;
        markSeen();
        if (take) start();
      }
    });
    P.__freoTourActive = true;
    d.drive();
  }

  // Start once the page has drawn: the band and a chart for the tour (steps for
  // cards this view doesn't have are skipped), the ? button for the prompt.
  // Checked every 100 ms, for up to 6 s.
  function whenReady(sel, cb) {
    var tries = 0, timer = setInterval(function () {
      if (sel.every(function (q) { return doc.querySelector(q); }) || ++tries > 60) {
        clearInterval(timer);
        load(cb);
      }
    }, 100);
  }

  function runTour() {
    if (P.__freoTourRunning || P.__freoTourActive) return;
    P.__freoTourRunning = true;
    whenReady([".cv-band", ".js-plotly-plot"], function () { P.__freoTourRunning = false; start(); });
  }

  function maybeStart(force) {
    var seen = false;
    try { seen = P.localStorage.getItem(DONE_KEY) === "1"; } catch (e) {}
    var forced = force && force !== P.__freoTourForce;
    if (forced) P.__freoTourForce = force;
    if (forced) return runTour();
    // Reruns re-render this frame; never start a second tour over a running one.
    if (seen || P.__freoTourRunning || P.__freoTourActive) return;
    P.__freoTourRunning = true;
    whenReady([".st-key-tour_btn", ".js-plotly-plot"], function () {
      P.__freoTourRunning = false; prompt(); });
  }

  // The ? button starts the tour here, straight away, instead of rerunning the
  // app first: a capture listener on the page sees the click before Streamlit
  // does and stops it. (Python's tour.replay() stays as the fallback.) Replaced
  // on each load of this frame, so it never calls into an old frame.
  if (P.__freoTourClick) doc.removeEventListener("click", P.__freoTourClick, true);
  P.__freoTourClick = function (e) {
    if (!e.target.closest || !e.target.closest(".st-key-tour_btn button")) return;
    e.preventDefault(); e.stopPropagation();
    markSeen();
    runTour();
  };
  doc.addEventListener("click", P.__freoTourClick, true);
  load(function () {});   // fetch driver.js now, so the first ? click doesn't wait for it

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "streamlit:render") {
      send("streamlit:setFrameHeight", {height: 0});
      P.__freoTourPhone = !!(e.data.args || {}).phone;
      maybeStart((e.data.args || {}).force);
    }
  });
  send("streamlit:componentReady", {apiVersion: 1});
})();
</script>
</body>
</html>
