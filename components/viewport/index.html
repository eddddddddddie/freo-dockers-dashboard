<!doctype html>
<html>
<head><meta charset="utf-8"><title>viewport</title></head>
<body style="margin:0">
<script>
// Reports the dashboard window's size to Python (Streamlit component protocol),
// and again whenever it is resized by more than a few pixels.
(function () {
  function send(type, extra) {
    window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, extra), "*");
  }
  function size() {
    var w = window.parent || window;
    return {w: w.innerWidth, h: w.innerHeight};
  }
  // The last size sent is kept on the parent window, so a remounted frame does
  // not resend it: every send reruns the app and would cut off a streaming answer.
  var store = (function () { try { return window.parent; } catch (e) { return window; } })();
  var timer = null;
  function report(force) {
    var s = size(), last = store.__freoViewportSent;
    if (!force && last && Math.abs(s.w - last.w) < 16 && Math.abs(s.h - last.h) < 16) return;
    store.__freoViewportSent = s;
    send("streamlit:setComponentValue", {value: s, dataType: "json"});
  }
  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "streamlit:render") {
      send("streamlit:setFrameHeight", {height: 0});
      // need: Python has no size yet (a new session), so send even if unchanged.
      report(!!(e.data.args || {}).need);
    }
  });
  try {
    window.parent.addEventListener("resize", function () {
      clearTimeout(timer);
      timer = setTimeout(function () { report(false); }, 250);
    });
    // Streamlit doesn't rerun on the browser's Back/Forward, so tell Python the
    // address changed; nav.apply_pending then moves to the view in the address.
    // Streamlit only listens to the frame it currently shows, so each new copy
    // of this frame replaces the previous copy's listener.
    if (store.__freoPopstate) window.parent.removeEventListener("popstate", store.__freoPopstate);
    store.__freoPopstate = function () {
      var s = size();
      // Streamlit's own record of the address isn't updated on Back/Forward,
      // so send the new one with the message.
      send("streamlit:setComponentValue", {value: {w: s.w, h: s.h, pop: Date.now(),
        search: window.parent.location.search}, dataType: "json"});
    };
    window.parent.addEventListener("popstate", store.__freoPopstate);
  } catch (err) { /* parent not reachable: keep the first reading */ }
  send("streamlit:componentReady", {apiVersion: 1});
})();
</script>
</body>
</html>
